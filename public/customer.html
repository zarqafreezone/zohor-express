<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الزبون — الزهور اكسبرس</title>
  <link rel="icon" type="image/png" href="/img/icons/favicon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/icons/icon-64.png">
  <link rel="apple-touch-icon" href="/img/icons/apple-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#4c1d95">
  <link rel="stylesheet" href="/css/style.css?v=15">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="logo"><img class="top-brand" src="/img/brand/mark-256.png" alt="الزهور اكسبرس"></div>
    <div class="titles">
      <h1 id="hdr-title">الزهور اكسبرس</h1>
      <div class="sub" id="hdr-sub">مرحباً بك 👋</div>
    </div>
    <button class="hdr-btn" id="hdr-back" onclick="history.length > 1 ? history.back() : location.href='/'">رجوع</button>
    <a class="hdr-btn" href="/" style="text-decoration:none">الرئيسية</a>
    <a class="hdr-btn" href="/admin.html" style="text-decoration:none">الإدارة</a>
  </header>

  <!-- تسجيل الدخول / الترحيب -->
  <div class="container" id="view-login" style="display:none">
    <div class="login-hero">
      <div class="hero-brand"><img src="/img/brand/mark-256.png" alt="الزهور اكسبرس"><span class="badge">🛍️</span></div>
      <h2>أهلاً في الزهور اكسبرس</h2>
      <p>سجّل بياناتك مرة واحدة واطلب من محلات جبل الزهور</p>
    </div>
    <div class="card">
      <div class="field">
        <label>الاسم</label>
        <input class="input" id="in-name" placeholder="مثال: أحمد محمد">
      </div>
      <div class="field">
        <label>رقم الموبايل</label>
        <input class="input" id="in-phone" type="tel" inputmode="tel" placeholder="0791234567 أو +962791234567">
      </div>
      <div class="field">
        <label>رقم موبايل إضافي (اختياري)</label>
        <input class="input" id="in-phone2" type="tel" inputmode="tel" placeholder="للتواصل البديل عند الإغلاق">
      </div>
      <div class="field">
        <label>الحي / المنطقة</label>
        <input class="input" id="in-area" placeholder="مثال: جبل الزهور — حي النزهة">
      </div>
      <div class="grid2">
        <div class="field">
          <label>الشارع</label>
          <input class="input" id="in-street" placeholder="مثال: شارع الملكة رانيا">
        </div>
        <div class="field">
          <label>البناية / الطابق</label>
          <input class="input" id="in-building" placeholder="مثال: بناية 12 — الطابق 3">
        </div>
      </div>
      <div class="field">
        <label>علامة مميزة قربك</label>
        <input class="input" id="in-landmark" placeholder="مثال: مقابل مسجد النور">
      </div>
      <button class="btn block" id="btn-login">ابدأ الطلب 🌸</button>
    </div>
  </div>

  <!-- الرئيسية: المحلات -->
  <div class="container" id="view-home" style="display:none">
    <div class="search-wrap">
      <span class="search-ic">🔍</span>
      <input id="global-search" class="search-input" type="search" placeholder="ابحث عن محل، منتج، خدمة في جبل الزهور" autocomplete="off">
      <button id="search-clear" aria-label="مسح البحث" style="display:none">✕</button>
    </div>
    <div id="search-results" style="display:none"></div>
    <div id="ads-strip"></div>
    <div id="offers-section" style="display:none"></div>
    <div class="section-title">🏪 محلات المنطقة <span class="count" id="shops-count">0</span></div>
    <div class="tabs" id="cat-tabs" style="margin-top:0"></div>
    <div class="shops-grid" id="shops-grid"></div>
  </div>

  <!-- صفحة المحل والمنتجات -->
  <div class="container" id="view-shop" style="display:none"></div>

  <!-- طلباتي -->
  <div class="container" id="view-orders" style="display:none"></div>

  <!-- متابعة طلب -->
  <div class="container" id="view-track" style="display:none"></div>

  <!-- حسابي -->
  <div class="container" id="view-account" style="display:none"></div>

  <!-- شريط السلة -->
  <div id="cart-bar-wrap"></div>

  <!-- شريط التنقل -->
  <nav class="bottom-nav" id="nav">
    <div class="inner">
      <a href="#" data-view="home" class="active"><span class="ic">🏪</span>المحلات<span class="bubble" id="orders-bubble" style="display:none">0</span></a>
      <a href="#" data-view="orders"><span class="ic">🧾</span>طلباتي</a>
      <a href="#" data-view="account"><span class="ic">👤</span>حسابي</a>
    </div>
  </nav>

  <script src="/js/common.js?v=15"></script>
  <script src="/js/sounds.js?v=15"></script>
  <script src="/js/customer.js?v=15"></script>
  <script>
  // الإعلان المنبثق — يظهر أيضاً عند دخول الزبون مباشرة (مرة واحدة في الجلسة)
  (function () {
    try { if (sessionStorage.getItem('zh_popupSeen')) return; } catch { /* لا شيء */ }
    fetch('/api/popup').then((r) => r.json()).then((d) => {
      if (d.popup && d.popup.active) setTimeout(() => showPopupAd(d.popup), 700);
    }).catch(() => {});
  })();
  </script>
</body>
</html>
